services:
  backend:
    build: ./backend
    container_name: prospecta-backend
    env_file: ./backend/.env
    ports:
      - "8000:8000"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY}
    container_name: prospecta-frontend
    ports:
      - "3000:8080"
    depends_on:
      - backend
    restart: unless-stopped